<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#161823">
  <title>抖音下载站</title>
  <link rel="stylesheet" href="/static/app.css?v=13">
</head>
<body>
  <main class="page">
    <header class="brand">
      <h1>抖音下载站</h1>
      <p class="slogan">粘贴分享文案，下载无水印视频 / 图文；也支持用户主页</p>
    </header>

    <section id="view-login" class="card hidden">
      <label class="field-label" for="password">访问密码</label>
      <input id="password" type="password" placeholder="请输入访问密码"
             autocomplete="current-password" enterkeyhint="go">
      <button id="btn-login" class="btn primary" type="button">进入</button>
      <p id="login-error" class="error hidden"></p>
    </section>

    <section id="view-main" class="card hidden">
      <label class="field-label" for="share-text">分享文案 / 链接（作品可多条，主页一次一条）</label>
      <textarea id="share-text" rows="5"
                placeholder="作品：复制打开抖音，看看【xxx的作品】 https://v.douyin.com/xxxx/&#10;主页：查看TA的更多作品 https://v.douyin.com/xxxx/（每页约 100 条，可继续翻页）"></textarea>
      <div class="btn-row">
        <button id="btn-parse" class="btn primary" type="button">解 析</button>
        <button id="btn-clear" class="btn ghost" type="button">清 空</button>
      </div>
      <p id="parse-error" class="error hidden"></p>
    </section>

    <section id="view-result" class="hidden">
      <p id="result-summary" class="summary"></p>
      <div id="result-list" class="result-list"></div>
      <div class="btn-row result-actions">
        <button id="btn-download-page" class="btn primary" type="button">一键下载</button>
        <button id="btn-more" class="btn ghost hidden" type="button">继续解析下一页</button>
      </div>
      <button id="btn-again" class="btn ghost" type="button">再解析一批</button>
    </section>

    <footer class="foot">个人家庭专用 · 请勿公开传播</footer>
  </main>
  <script src="/static/app.js?v=13"></script>
</body>
</html>
